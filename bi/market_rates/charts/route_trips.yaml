slice_name: Сделки и перевозчики
description: Доказательная база маршрута по месяцам
viz_type: echarts_timeseries_bar
params:
  viz_type: echarts_timeseries_bar
  x_axis: month
  time_grain_sqla: P1M
  x_axis_sort_asc: true
  metrics:
