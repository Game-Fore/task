name: smart-logistics

x-pipeline-env: &pipeline-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  SOURCE_DB: ${SOURCE_DB:-deals_bigdata}
  DWH_DB: ${DWH_DB:-dwh}
  ETL_START_DATE: ${ETL_START_DATE:-2023-01-01}
  ETL_END_DATE: ${ETL_END_DATE:-2027-12-31}
  AS_OF: ${AS_OF:-2026-10-26}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-airflow: &airflow
  image: smart-logistics-airflow
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  profiles: ["airflow"]
  environment: &airflow-env
    <<: *pipeline-env
    ML_MODELS_DIR: /opt/airflow/ml_models
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-dev-secret}
    AIRFLOW__WEBSERVER__WORKERS: 2
  volumes:
    - airflow_ml_models:/opt/airflow/ml_models

x-superset: &superset
  image: smart-logistics-superset
  build:
    context: .
    dockerfile: docker/superset.Dockerfile
  profiles: ["superset"]
  environment: &superset-env
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-local-dev-superset-secret}
    SUPERSET_METADATA_URI: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/superset

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${SOURCE_DB:-deals_bigdata}
      DWH_DB: ${DWH_DB:-dwh}
      N_PRICES: ${N_PRICES:-300000}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./sql/source:/source:ro
    healthcheck:
      # во время initdb сервер слушает только сокет, так что по TCP проверка пройдёт после генерации данных
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 600s

  pipeline:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *pipeline-env
      ML_MODELS_DIR: /app/models
    volumes:
      - ml_models:/app/models

  airflow-init:
    <<: *airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
      CONNECTION_CHECK_MAX_COUNT: "0"  # база airflow ещё может не существовать
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    command: ["bash", "/opt/airflow/airflow_init.sh"]

  airflow-webserver:
    <<: *airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    ports:
      - "${AIRFLOW_HOST_PORT:-8080}:8080"

  airflow-scheduler:
    <<: *airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  superset-init:
    <<: *superset
    depends_on:
      pipeline:
        condition: service_completed_successfully  # нужны схема mart и данные
    environment:
      <<: *superset-env
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DWH_DB: ${DWH_DB:-dwh}
      BI_READER_PASSWORD: ${BI_READER_PASSWORD:-bi_reader}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
    command: ["bash", "/app/superset_init.sh"]

  superset:
    <<: *superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
    ports:
      - "${SUPERSET_HOST_PORT:-8088}:8088"

volumes:
  pgdata:
  ml_models:
  airflow_ml_models:
